name: Weekly Championship xG update

on:
  schedule:
    # 06:00 UTC every Tuesday - the morning after the weekend's
    # Championship fixtures (and any midweek games) have finished.
    - cron: '0 6 * * 2'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated data/ files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly update
        run: python run_weekly_update.py --league championship

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly Championship data update: $(date -u +'%Y-%m-%d')"
          # Several league workflows push to main around the same time, so a
          # push can be rejected if another one landed first. Pull their
          # changes in underneath ours and retry.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

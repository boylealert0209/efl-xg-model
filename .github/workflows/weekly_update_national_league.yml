name: Weekly National League xG update

# EXPERIMENTAL: whether FotMob actually publishes shot-based xG for the
# National League (English football's 5th tier) has NOT been confirmed -
# see the note in leagues.py. Run `python scrape_fotmob.py --league
# national-league --output data/fotmob_national-league_xg.csv` locally
# first and check how many matches come back with an xG value before
# relying on this running unattended - if FotMob has no xG for this tier,
# team_match_deltas_national-league.csv (and the report built from it)
# will end up empty, even though this workflow will report "success".
# Delete this file if you don't want it running on a schedule.

on:
  schedule:
    # 07:15 UTC every Tuesday - staggered after the other five league jobs
    # so they don't all hit football-data.co.uk/FotMob at the exact same
    # second.
    - cron: '15 7 * * 2'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated data/ files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly update
        run: python run_weekly_update.py --league national-league

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Weekly National League data update: $(date -u +'%Y-%m-%d')"
          git push
